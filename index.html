<!DOCTYPE html>
<html lang="id">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c8102e">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPERATOR - Papan Skor Karate</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#12151b;--ink:#f2f4f7;--aka:#c8102e;--ao:#1550c8;--gold:#e0a800}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Barlow Condensed",sans-serif;padding:16px}
.header{text-align:center;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.btn-open-display{background:var(--gold);color:#000;border:0;padding:8px 16px;font-weight:800;border-radius:6px;cursor:pointer}

.grid{display:grid;grid-template-columns:1fr minmax(220px,260px) 1fr;gap:16px}
.card{border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.aka{background:var(--aka)}.ao{background:var(--ao)}

.title{font-size:32px;font-weight:800;text-align:center}
input{width:100%;padding:8px;border-radius:6px;border:1px solid rgba(255,255,255,0.3);background:rgba(0,0,0,0.3);color:#fff;font-weight:700;font-size:18px;text-align:center}
.score-preview{font-size:80px;font-weight:800;text-align:center;line-height:1}

.pts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
button{cursor:pointer;border:0;border-radius:6px;font-weight:800}
.pts-grid button{background:#fff;color:#000;padding:12px 4px;font-size:20px}
.pts-grid button small{display:block;font-size:12px;font-weight:500;color:#555}

.row{display:flex;gap:6px;justify-content:space-between;align-items:center}
.btn-sen{background:rgba(0,0,0,0.4);color:#fff;border:1px solid #fff;padding:8px 12px;font-size:16px}
.btn-sen[aria-pressed="true"]{background:var(--gold);color:#000}
.btn-minus{background:rgba(0,0,0,0.4);color:#fff;border:1px solid #fff;padding:8px 12px;font-size:16px}

.penaltys{display:flex;gap:4px;align-items:center}
.penaltys b{font-size:16px}
.penaltys button{width:36px;height:32px;background:rgba(0,0,0,0.3);color:#fff;border:1px solid #fff;font-size:14px}
.penaltys button.on{background:#fff;color:#000}

/* MID CONTROL */
.mid-card{background:#1d222b;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center}
.timer-disp{font-size:60px;font-weight:800;background:#fff;color:#000;width:100%;text-align:center;border-radius:8px;padding:6px;cursor:pointer}
.btn-go{width:100%;background:var(--gold);color:#000;padding:12px;font-size:22px}
.btn-reset{width:100%;background:#c8102e;color:#fff;padding:8px;font-size:16px}
</style>
</head>
<body>

<div class="header">
  <h2>PANEL KONTROL OPERATOR</h2>
  <button class="btn-open-display" onclick="window.open('display.html', '_blank')">Buka Tampilan Monitor (Display)</button>
</div>

<div class="grid">
  <!-- AKA -->
  <div class="card aka">
    <div class="title">AKA (MERAH)</div>
    <input type="text" id="n-aka" placeholder="Nama Peserta" oninput="updateData()">
    <input type="text" id="p-aka" placeholder="PERGURUAN" oninput="updateData()">
    <div class="score-preview" id="sc-aka">0</div>
    <div class="pts-grid">
      <button onclick="add('aka',1)">+1<small>Yuko</small></button>
      <button onclick="add('aka',2)">+2<small>Waza-ari</small></button>
      <button onclick="add('aka',3)">+3<small>Ippon</small></button>
    </div>
    <div class="row">
      <button class="btn-sen" id="sen-aka" onclick="toggleSen('aka')">Senshu</button>
      <button class="btn-minus" onclick="add('aka',-1)">-1 Poin</button>
    </div>
    <div class="penaltys" id="pen-aka"></div>
  </div>

  <!-- MID TIMER -->
  <div class="mid-card">
    <div class="timer-disp" onclick="editTime()" id="time">3:00</div>
    <button class="btn-go" id="btn-go" onclick="toggleTimer()">MULAI</button>
    <button class="btn-reset" onclick="resetMatch()">RESET MATCH</button>
  </div>

  <!-- AO -->
  <div class="card ao">
    <div class="title">AO (BIRU)</div>
    <input type="text" id="n-ao" placeholder="Nama Peserta" oninput="updateData()">
    <input type="text" id="p-ao" placeholder="PERGURUAN" oninput="updateData()">
    <div class="score-preview" id="sc-ao">0</div>
    <div class="pts-grid">
      <button onclick="add('ao',1)">+1<small>Yuko</small></button>
      <button onclick="add('ao',2)">+2<small>Waza-ari</small></button>
      <button onclick="add('ao',3)">+3<small>Ippon</small></button>
    </div>
    <div class="row">
      <button class="btn-sen" id="sen-ao" onclick="toggleSen('ao')">Senshu</button>
      <button class="btn-minus" onclick="add('ao',-1)">-1 Poin</button>
    </div>
    <div class="penaltys" id="pen-ao"></div>
  </div>
</div>

<script>
const channel = new BroadcastChannel('karate_scoreboard');
const PEN = ['C1','C2','C3','HC','H'];

let S = {
  t: 180, dur: 180, run: false, winner: null,
  aka: { name: '', perg: '', pts: 0, pen: 0, sen: false },
  ao: { name: '', perg: '', pts: 0, pen: 0, sen: false }
};

let timer = null, last = 0;

function updateData(){
  S.aka.name = document.getElementById('n-aka').value;
  S.aka.perg = document.getElementById('p-aka').value;
  S.ao.name = document.getElementById('n-ao').value;
  S.ao.perg = document.getElementById('p-ao').value;
  render();
}

function checkWinner(){
  const diff = S.aka.pts - S.ao.pts;
  if (Math.abs(diff) >= 8) {
    S.winner = diff >= 8 ? 'aka' : 'ao';
    if(S.run) stop();
  } else {
    S.winner = null;
  }
}

function render(){
  checkWinner();
  
  // Update Operator UI
  ['aka','ao'].forEach(k=>{
    document.getElementById('sc-'+k).textContent = S[k].pts;
    document.getElementById('sen-'+k).setAttribute('aria-pressed', S[k].sen);
    document.getElementById('pen-'+k).innerHTML = '<b>Pen:</b> ' + PEN.map((p,i)=>
      `<button class="${S[k].pen > i ? 'on':''}" onclick="setPen('${k}',${i})">${p}</button>`
    ).join('');
  });

  document.getElementById('time').textContent = fmt(S.t);
  document.getElementById('btn-go').textContent = S.run ? 'JEDA' : (S.t < S.dur ? 'LANJUT' : 'MULAI');

  // KIRIM DATA KE MONITOR DISPLAY
  channel.postMessage(S);
}

function fmt(t){
  if(t<10&&t>0)return '0:0'+t.toFixed(1);
  const s=Math.ceil(t);
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}

function stop(){ clearInterval(timer); timer = null; S.run = false; }

function tick(){
  const n = performance.now();
  S.t = Math.max(0, S.t - (n - last)/1000);
  last = n;
  if(S.t <= 0){ S.t = 0; stop(); }
  render();
}

function toggleTimer(){
  if(S.winner) return;
  if(S.run){
    stop();
  } else {
    if(S.t <= 0) S.t = S.dur;
    S.run = true;
    last = performance.now();
    timer = setInterval(tick, 100);
  }
  render();
}

function add(k, p){
  if(S[k].pts + p < 0) return;
  S[k].pts += p;
  if(p > 0 && S.aka.pts + S.ao.pts === p && !S.aka.sen && !S.ao.sen) S[k].sen = true;
  render();
}

function toggleSen(k){
  S[k].sen = !S[k].sen;
  if(S[k].sen) S[k === 'aka' ? 'ao' : 'aka'].sen = false;
  render();
}

function setPen(k, i){
  S[k].pen = S[k].pen === i + 1 ? i : i + 1;
  render();
}

function editTime(){
  if(S.run) return;
  const m = Math.floor(S.t / 60);
  const s = Math.floor(S.t % 60);
  const inputM = prompt("Masukkan Menit:", m);
  if(inputM === null) return;
  const inputS = prompt("Masukkan Detik:", s);
  if(inputS === null) return;
  const total = ((parseInt(inputM, 10)||0) * 60) + (parseInt(inputS, 10)||0);
  if(total >= 0){ S.t = total; S.dur = total; render(); }
}

function resetMatch(){
  stop();
  S.t = S.dur; S.winner = null;
  ['aka','ao'].forEach(k=>{ S[k].pts = 0; S[k].pen = 0; S[k].sen = false; });
  render();
}

render();
</script>
</body>
</html>
